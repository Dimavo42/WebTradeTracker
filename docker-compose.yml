name: webtradetracker_ctypescript_webapp

services:
  kafka:
    image: apache/kafka:4.1.2
    ports:
     - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - trade_network
      
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trade_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - trade_network
  bff:
    build:
      context: ./backend-bff
      dockerfile: Dockerfile
    container_name: trade_bff
    ports:
      - "3001:3000"
    depends_on:
      - backend
    environment:
      DOTNET_API_URL: http://backend:8080
    networks:
      - trade_network

  backend:
    build:
      context: .
      dockerfile: backend/TradeWebAPI/Dockerfile
    container_name: trade_backend
    restart: on-failure
    ports:
      - "5000:8080"
    depends_on:
      - db
      - kafka
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Kafka__BootstrapServers: "kafka:29092"
      ConnectionStrings__Sql: "Server=db;Database=TradeDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"
    networks:
      - trade_network

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: trade_sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - trade_network

volumes:
  sql_data:

networks:
  trade_network: