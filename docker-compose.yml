name: webtradetracker

services:
  kafka:
    image: apache/kafka:4.1.2
    ports:
     - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - trade_network  

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL the *browser* uses to reach the BFF (host port 3001 + Nest's /api prefix)
        BASE_URL: "http://localhost:3001/api"
    container_name: trade_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - trade_network

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ollama serve &
        server_pid=$$!

        trap 'kill "$$server_pid" 2>/dev/null || true' EXIT
        trap 'exit 0' TERM INT

        until ollama list >/dev/null 2>&1; do
          sleep 1
        done

        ollama pull llama3.2
        wait "$$server_pid"
    networks:
      - trade_network

      
  bff:
    build:
      context: ./backend-bff
      dockerfile: Dockerfile
    container_name: trade_bff
    ports:
      - "3001:3000"
    depends_on:
      - backend
    environment:
      DOTNET_API_URL: http://backend:8080
      PORT : "3000"
      FRONT_URL : "http://frontend:3000"
      MOBILE_ORIGIN: "*"
      OLLAMA_BASE_URL: http://ollama:11434
    networks:
      - trade_network
      

  backend:
    build:
      context: .
      dockerfile: backend/TradeWebAPI/Dockerfile
    container_name: trade_backend
    restart: on-failure
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Kafka__BootstrapServers: "kafka:29092"
      ConnectionStrings__Sql: "Server=db;Database=TradeDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"
    networks:
      - trade_network

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: trade_sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - trade_network


  audit:
    build:
      context: ./audit
      dockerfile: Dockerfile
    container_name: trade_audit
    restart: on-failure
    environment:
      PORT : "3002"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_GROUP_ID: "trade-audit"
      AUDIT_DB_PATH: /data
    volumes:
      - audit_data:/data
    ports:
      - "3002:3002"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
     - trade_network


  tls:
   build:
      context: ./tls-server
      dockerfile: Dockerfile
   environment:
      SERVER_PORT: "8081"
      UPSTREAM_HOST: "frontend"
      UPSTREAM_PORT: "80"
      WORKERS: 4
      KEYS_SIZE : "4096"
      CERT_DIR: "/app/certs"
      SERVER_HOST: "0.0.0.0"
   volumes:
     - tls_certs:/app/certs
   depends_on:
     - frontend
   ports:
     - "8081:8081"
   networks:
     - trade_network

volumes:
  sql_data:
  audit_data:
  tls_certs:
  ollama_data:
  
   
networks:
  trade_network: