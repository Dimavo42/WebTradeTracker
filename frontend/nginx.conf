server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the BFF at request time (via the variable below)
    # means nginx still starts if the bff container isn't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bff_upstream http://bff:3000;

    # REST API -> NestJS BFF. The browser calls /api/... on this same origin,
    # so there is no localhost URL baked into the bundle and no CORS preflight.
    location /api/ {
        proxy_pass $bff_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The chatbot waits up to 120s for Ollama
        proxy_read_timeout 130s;
    }

    # Live support chat (socket.io over WebSocket) -> NestJS BFF
    location /socket.io/ {
        proxy_pass $bff_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
